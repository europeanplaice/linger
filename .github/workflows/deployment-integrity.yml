name: Deployment Integrity Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  actions: read
  contents: read

concurrency:
  group: deployment-integrity-audit
  cancel-in-progress: false

jobs:
  resolve-production-target:
    name: Resolve production deployment
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.latest.outputs.sha }}
      skip: ${{ steps.latest.outputs.skip }}
    steps:
      - name: Checkout the audit scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Find latest successful production deployment run
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/latest-successful-production-run.mjs

  verify-production-deployment:
    name: Verify production deployment ${{ needs.resolve-production-target.outputs.sha }}
    needs: resolve-production-target
    if: needs.resolve-production-target.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the audit scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Checkout the deployed source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-production-target.outputs.sha }}
          path: source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: source/.nvmrc
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Match the deployed source's npm version
        run: npm install --global "$(node -p "require('./source/package.json').packageManager")"

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Rebuild the expected production assets
        working-directory: source
        env:
          DEPLOY_VERSION: ${{ needs.resolve-production-target.outputs.sha }}
          DEPLOY_BRANCH: main
          DEPLOY_COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.resolve-production-target.outputs.sha }}
          DEPLOY_AUDIT_HISTORY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/deployment-integrity.yml?query=branch%3Amain
        run: npm run build

      - name: Compare Cloudflare production deployment with GitHub Actions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: linger
          VERIFICATION_MODE: scheduled
          EXPECTED_COMMIT_SHA: ${{ needs.resolve-production-target.outputs.sha }}
          EXPECTED_BRANCH: main
          EXPECTED_COMMIT_DIRTY: 'false'
          DIST_DIRECTORY: source/dist
        run: node scripts/verify-pages-deployment.mjs
