name: CI and Deploy

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:unit

      - run: node scripts/check-deployment.test.mjs

  # Tests/builds the s3-workflows Worker only — it does not deploy it. Deployment
  # happens via `wrangler deploy` in the deploy/deploy-staging jobs below, using
  # wrangler.jsonc/wrangler.staging.jsonc. Terraform (infra/) only owns the
  # surrounding scaffolding (KV namespaces, DNS, Pages projects) — it no longer
  # manages the Worker script or its Workflow bindings.
  workers-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:workflows

      - run: npm run test:workers

  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium webkit

      - run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run audit

  deploy:
    needs: [build, lint, unit-test, workers-test, e2e-test, npm-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          DEPLOY_VERSION: ${{ github.sha }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy workers/s3-workflows/src/index.ts --config workers/s3-workflows/wrangler.jsonc

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=linger --commit-hash=${{ github.sha }}

      - name: Verify production deployment
        timeout-minutes: 3
        run: node scripts/check-deployment.mjs https://linger.europeanplaice.com

  deploy-staging:
    needs: [build, lint, unit-test, workers-test, e2e-test, npm-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          DEPLOY_VERSION: ${{ github.sha }}

      # `wrangler pages deploy` rejects `--config <path>` ("Pages does not
      # support custom paths for the Wrangler configuration file"), so the
      # only way to give this deploy staging's own bindings is to overwrite
      # the default wrangler.toml in this job's own throwaway checkout —
      # otherwise it silently bakes in production's S3_WORKFLOW_SERVICE/
      # SESSIONS bindings, regardless of --project-name/--branch.
      - run: cp wrangler.staging.toml wrangler.toml

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy workers/s3-workflows/src/index.ts --config workers/s3-workflows/wrangler.staging.jsonc

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=linger-staging --commit-hash=${{ github.sha }} --branch=staging

      - name: Verify staging deployment
        timeout-minutes: 3
        run: node scripts/check-deployment.mjs https://staging.linger.europeanplaice.com
