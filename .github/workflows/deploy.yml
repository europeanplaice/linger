name: CI and Deploy

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install --global npm@12.2.2

      - run: npm ci

      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install --global npm@12.2.2

      - run: npm ci

      - run: npm run lint

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install --global npm@12.2.2

      - run: npm ci

      - run: npm run test:unit

      - run: npm run test:deployment

  privacy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install --global npm@12.2.2

      - run: npm ci

      - name: Check privacy storage and request boundaries
        run: npm run test:privacy

  # Tests/builds the s3-workflows Worker only — it does not deploy it. Deployment
  # happens via `wrangler deploy` in the deploy/deploy-staging jobs below, using
  # wrangler.jsonc/wrangler.staging.jsonc. Terraform (infra/) only owns the
  # surrounding scaffolding (KV namespaces, DNS, Pages projects) — it no longer
  # manages the Worker script or its Workflow bindings.
  workers-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install --global npm@12.2.2

      - run: npm ci

      - run: npm run build:workflows

      - run: npm run test:workers

  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install --global npm@12.2.2

      - run: npm ci

      - name: Install Playwright browsers and system dependencies
        timeout-minutes: 5
        run: |
          # Skip the Azure mirror when its DNS or downloads are unavailable.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium webkit

      - name: Run E2E tests
        timeout-minutes: 20
        run: npm test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install --global npm@12.2.2

      - run: npm ci

      - run: npm run audit

  deploy:
    needs: [build, lint, unit-test, privacy-test, workers-test, e2e-test, npm-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install --global npm@12.2.2

      - run: npm ci

      - run: npm run build
        env:
          DEPLOY_VERSION: ${{ github.sha }}
          DEPLOY_BRANCH: main
          DEPLOY_COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          DEPLOY_AUDIT_HISTORY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/deployment-integrity.yml?query=branch%3Amain

      - name: Apply authentication database migrations
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply AUTH_DB --remote --config workers/s3-workflows/wrangler.jsonc

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy workers/s3-workflows/src/index.ts --config workers/s3-workflows/wrangler.jsonc

      - id: production-pages-deploy-start
        run: echo "timestamp=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - id: production-pages-deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=linger --branch=main --commit-hash=${{ github.sha }} --commit-dirty=false

      - name: Verify production deployment and served assets
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: linger
          EXPECTED_DEPLOYMENT_URL: ${{ steps.production-pages-deploy.outputs.deployment-url }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          EXPECTED_BRANCH: main
          EXPECTED_COMMIT_DIRTY: 'false'
          DEPLOY_STARTED_AT: ${{ steps.production-pages-deploy-start.outputs.timestamp }}
          DIST_DIRECTORY: dist
        run: node scripts/verify-pages-deployment.mjs

      - name: Verify production deployment
        timeout-minutes: 3
        env:
          DEPLOYMENT_URL: ${{ steps.production-pages-deploy.outputs.deployment-url }}
        run: node scripts/check-deployment.mjs "$DEPLOYMENT_URL"

  deploy-staging:
    needs: [build, lint, unit-test, privacy-test, workers-test, e2e-test, npm-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install --global npm@12.2.2

      - run: npm ci

      - run: npm run build
        env:
          DEPLOY_VERSION: ${{ github.sha }}
          DEPLOY_BRANCH: staging
          DEPLOY_COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

      # `wrangler pages deploy` rejects `--config <path>` ("Pages does not
      # support custom paths for the Wrangler configuration file"), so the
      # only way to give this deploy staging's own bindings is to overwrite
      # the default wrangler.toml in this job's own throwaway checkout —
      # otherwise it silently bakes in production's S3_WORKFLOW_SERVICE/
      # SESSIONS bindings, regardless of --project-name/--branch.
      - run: cp wrangler.staging.toml wrangler.toml

      - name: Apply staging authentication database migrations
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply AUTH_DB --remote --config workers/s3-workflows/wrangler.staging.jsonc

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy workers/s3-workflows/src/index.ts --config workers/s3-workflows/wrangler.staging.jsonc

      - id: staging-pages-deploy-start
        run: echo "timestamp=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - id: staging-pages-deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=linger-staging --commit-hash=${{ github.sha }} --branch=staging

      - name: Verify staging deployment and served assets
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: linger-staging
          EXPECTED_DEPLOYMENT_URL: ${{ steps.staging-pages-deploy.outputs.deployment-url }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          EXPECTED_BRANCH: staging
          DEPLOY_STARTED_AT: ${{ steps.staging-pages-deploy-start.outputs.timestamp }}
          DIST_DIRECTORY: dist
        run: node scripts/verify-pages-deployment.mjs

      - name: Verify staging deployment
        timeout-minutes: 3
        env:
          DEPLOYMENT_URL: ${{ steps.staging-pages-deploy.outputs.deployment-url }}
        run: node scripts/check-deployment.mjs "$DEPLOYMENT_URL"
